# Supabase local dev config — QuizWave
# Run from repo root: `supabase start`, `supabase db push`, `supabase db reset`
# Hosted: create a project at supabase.com, then use its Session pooler URL as DATABASE_URL
# (Transaction mode, port 6543) in backend/.env and Render.

project_id = "quizwave"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://quizwave.vercel.app"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[realtime]
enabled = true
